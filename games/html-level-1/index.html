<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>بناء صفحتي الأولى — المبرمج الصغير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="game-header">
  <a class="back-btn" href="../../index.html" aria-label="رجوع للخريطة">🏠</a>

  <div class="progress-track" id="progressTrack">
    <span class="step" data-step="0">1</span>
    <span class="line"></span>
    <span class="step" data-step="1">2</span>
    <span class="line"></span>
    <span class="step" data-step="2">3</span>
  </div>

  <div class="mascot" id="mascot" aria-hidden="true">
    <div class="mascot-antenna"></div>
    <div class="mascot-head">
      <div class="mascot-eye"></div>
      <div class="mascot-eye"></div>
      <div class="mascot-mouth"></div>
    </div>
  </div>
</header>

<main id="stage"></main>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
